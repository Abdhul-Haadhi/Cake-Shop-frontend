<!-- ============================================================== -->
<!-- Main wrapper - style you can find in pages.scss -->
<!-- ============================================================== -->
<div class="main-container"> 
    <!-- ============================================================== -->
    <!-- Topbar - style you can find in header.scss -->
    <!-- ============================================================== -->
    <mat-toolbar color="primary" class="topbar telative">
        <!-- ============================================================== -->
        <!-- Logo - style you can find in header.scss -->
        <!-- ============================================================== -->
        <div class="navbar-header">
            <a class="navbar-brand" [routerLink]="['/pages/landing-page']">
                <!-- Logo icon -->
                 <b>
                    <!--You can put here icon as well // <i class="wi wi-sunset"></i> //-->
                    <!-- Dark Logo icon -->
                    <!-- <img src="assets/images/logo-icon.svg" alt="homepage" class="dark-logo"> -->
                    <!-- Light Logo icon -->
                    <!-- <img src="assets/images/logo-light-icon.svg" alt="homepage" class="light-logo"> -->
                    <img src="assets/images/CakeLa_logo.jpg" alt="homepage" class="light-logo">
                    
                </b>
                <!--End Logo icon -->
                <!-- Logo text -->
                <span class="text-logo-icon" fxShow="false" fxShow.gt-xs>
                 <!-- dark Logo text -->
                 <!-- <img src="assets/images/logo-text.svg" alt="homepage" class="dark-logo"> -->
                 <!-- Light Logo text -->    
                 <!-- <img src="assets/images/logo-light-text.svg" class="light-logo" alt="homepage"> -->
                </span> 
            </a>
        </div>
        <!-- ============================================================== -->
        <!-- sidebar toggle -->
        <!-- ============================================================== -->
        
        <button mat-icon-button (click)="snav.toggle()" value="sidebarclosed">
            <mat-icon>menu</mat-icon>
        </button>

        <span class="flex-spacer"></span>
        <!-- ============================================================== -->
        <!-- app header component - style you can find in header.scss / header.component.ts-->
        <!-- ============================================================== -->

    <div class="notification-bell mr-5" (click)="toggleDropdown()">
      <div class="bell-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="notification-badge" *ngIf="unreadCount > 0">
          {{unreadCount > 99 ? '99+' : unreadCount}}
        </div>
      </div>

      <!-- Dropdown -->
      <div class="notification-dropdown" *ngIf="showDropdown" (click)="$event.stopPropagation()">
        <div class="dropdown-header">
          <h4>Notifications</h4>
          <button *ngIf="unreadCount > 0" (click)="markAllAsRead()" class="mark-all-read">
            Mark all as read
          </button>
        </div>

        <div class="notification-list" *ngIf="notifications.length > 0">
          <div 
            *ngFor="let notification of notifications" 
            class="notification-item"
            [class.unread]="!notification.readStatus"
            (click)="markAsRead(notification.id)"
          >
            <div class="notification-icon" [class]="'icon-' + notification.type">
              <span *ngIf="notification.type === 'success'">✓</span>
              <span *ngIf="notification.type === 'info'">ℹ</span>
              <span *ngIf="notification.type === 'warning'">⚠</span>
              <span *ngIf="notification.type === 'error'">✕</span>
            </div>
            <div class="notification-content">
              <div class="notification-message">{{notification.message}}</div>
              <div class="notification-time">{{getRelativeTime(notification.timeStamp)}}</div>
            </div>
            <div class="notification-status" *ngIf="!notification.readStatus"></div>
          </div>
        </div>

        <div *ngIf="notifications.length === 0" class="no-notifications">
          <div class="no-notifications-icon">🔔</div>
          <p>No notifications yet</p>
        </div>
      </div>
    </div>

        <div class="d-flex align-items-center">
            <div class="cart-icon">
                <button class="cart-button" (click)="goToCart()">
                    <i class="fa fa-cart-arrow-down" aria-hidden="true"></i>
                </button>
                
            </div>
            <app-header></app-header>
        </div> 
        
        
    </mat-toolbar>
    <!-- ============================================================== -->
    <!-- End Topbar - style you can find in pages.scss -->
    <!-- ============================================================== -->
    <mat-sidenav-container class="example-sidenav-container" [style.marginTop.px]="mobileQuery.matches ? 0 : 0">
        <!-- ============================================================== -->
        <!-- Sidebar - style you can find in sidebar.scss -->
        <!-- ============================================================== -->
        <mat-sidenav #snav id="snav" class="dark-sidebar pl-xs" [mode]="mobileQuery.matches ? 'side' : 'over'" fixedTopGap="0" [opened]="mobileQuery.matches" [disableClose]="mobileQuery.matches"  >
            
                <app-sidebar></app-sidebar>
               
            
        </mat-sidenav>
        <!-- ============================================================== -->
        <!-- Sidebar - style you can find in sidebar.scss -->
        <!-- ============================================================== -->
        
        <!-- ============================================================== -->
        <!-- Page container - style you can find in pages.scss -->
        <!-- ============================================================== -->
        <mat-sidenav-content class="page-wrapper">
                 
                <div class="page-content">
                   
                        <router-outlet><app-spinner></app-spinner></router-outlet>
                    
                </div>    
               
        </mat-sidenav-content>
        <!-- ============================================================== -->
        <!-- Page container - style you can find in pages.scss -->
        <!-- ============================================================== -->
    </mat-sidenav-container>
</div>

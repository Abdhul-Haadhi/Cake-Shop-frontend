<div class="container">
    <mat-toolbar color="primary">
        <span>Manual stock adjust</span>
        <span class="example-spacer"></span>
        <!-- <button class="form-button" mat-raised-button color="warn" (click)="showForm = true" *ngIf="!showForm">
          +Add Product
        </button> -->
    </mat-toolbar>

    <div *ngIf="showForm" class="form-section">
        <form [formGroup]="stockAdjustForm" class="example-form" (ngSubmit)="onSubmit()">
            <div class="example-form-div">

                <mat-form-field>
                    <mat-label>Stock Id</mat-label>
                    <input matInput formControlName="stockId" readonly="true">
                </mat-form-field>

                <mat-form-field>
                    <mat-label>Quantity</mat-label>
                    <input matInput formControlName="qty" readonly="true">
                </mat-form-field>

                <mat-form-field>
                    <mat-label>Stock item Id</mat-label>
                    <input matInput formControlName="stockItemId" readonly="true">
                </mat-form-field>

                <mat-form-field class="full-width">
                    <mat-label>Stock item name</mat-label>
                    <input matInput formControlName="stockItemName" readonly="true">
                </mat-form-field>

                <mat-form-field class="full-width">
                    <mat-label>Threshold quantity</mat-label>
                    <input matInput formControlName="thresholdQty">
                </mat-form-field>

            </div>

            <button type="submit" color="primary" class="form-button" mat-raised-button [disabled]="isButtonDisabled">{{
                saveButtonLabel }}</button>
            <button type="reset" color="secondary" class="form-button" mat-raised-button
                (click)="resetData()">Reset</button>
            <button mat-raised-button type="button" class="form-button" color="warn"
                (click)="closeForm()">Cancel</button>

        </form>
    </div>

    <!-- Table section -->


    <div class="table-section">
        <div class="refresh-filter-section">
            <div class="refresh-button">
                <button mat-icon-button color="primary" (click)="refreshData()">
                    <mat-icon>refresh</mat-icon>
                </button>
            </div>
            <div class="search">
                <mat-form-field class="filter">
                    <mat-label>Search</mat-label>
                    <input matInput (keyup)="applyFilter($event)" placeholder="Ex. ium" #input>
                </mat-form-field>
            </div>

        </div>

        <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

            <ng-container matColumnDef="stockId">
                <th mat-header-cell *matHeaderCellDef> Stock Id </th>
                <td mat-cell *matCellDef="let element"> {{element.stockId}} </td>
            </ng-container>

            <ng-container matColumnDef="qty">
                <th mat-header-cell *matHeaderCellDef> Quantity </th>
                <td mat-cell *matCellDef="let element"> {{element.qty}} </td>
            </ng-container>

            <ng-container matColumnDef="stockItemId">
                <th mat-header-cell *matHeaderCellDef> Stock item Id </th>
                <td mat-cell *matCellDef="let element"> {{element.stockItemId}} </td>
            </ng-container>

            <ng-container matColumnDef="stockItemName">
                <th mat-header-cell *matHeaderCellDef> Stock item name </th>
                <td mat-cell *matCellDef="let element"> {{element.stockItemName}} </td>
            </ng-container>

            <ng-container matColumnDef="thresholdQty">
                <th mat-header-cell *matHeaderCellDef> Threshold quantity </th>
                <td mat-cell *matCellDef="let element"> {{element.thresholdQty}} </td>
            </ng-container>

            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef> Actions </th>
                <td mat-cell *matCellDef="let element">
                    <button mat-icon-button color="warn" (click)="editData(element); showForm = true;" *ngIf="!showForm"
                        matTooltip="edit">
                        <mat-icon>edit</mat-icon>
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
        <mat-paginator [pageSizeOptions]="[10, 15, 25, 100]" aria-label="Select page of users"></mat-paginator>
    </div>

</div>

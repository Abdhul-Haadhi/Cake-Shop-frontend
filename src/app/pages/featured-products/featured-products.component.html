<mat-card appearance="outlined" class="flex">
  <mat-toolbar color="warn">
        <span>Featured products</span>
        <span class="example-spacer"></span>
    </mat-toolbar>

  <div class="products">
    <mat-card class="example-card" appearance="outlined" *ngFor="let product of products">
      <mat-card-header>
        <div mat-card-avatar class="example-header-image"></div>
        <mat-card-title>{{ product.product }}</mat-card-title>
      </mat-card-header>
      <a (click)="openPopup(product)">
        <img mat-card-image [src]="product.image" [alt]="product.product" />
      </a>
      <mat-card-actions class="open-button">
        <button (click)="openPopup(product)" mat-raised-button color="primary">
          View
        </button>
      </mat-card-actions>
    </mat-card>
  </div>
</mat-card>

<div class="employee-report-container">
  <div class="report-header">
    <h1>Supplier Report</h1>
  </div>

  <div class="actions-bar">
    <button class="print-button" (click)="printReport()">
      <span class="print-icon"></span> Print Report
    </button>
  </div>

  <div *ngIf="error" class="error-message">
    {{ error }}
  </div>

  <div class="table-container">
    <div class="table-section">
      <div class="refresh-filter-section">
        <div class="refresh-button">
          <button mat-icon-button color="primary" (click)="refreshData()">
            <mat-icon>refresh</mat-icon>
          </button>
        </div>

        <mat-form-field class="filter">
          <mat-label>Filter</mat-label>
          <input matInput (keyup)="applyFilter($event)" placeholder="Ex. ium" #input>
        </mat-form-field>
      </div>

      <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

        <ng-container matColumnDef="supplierID">
          <th mat-header-cell *matHeaderCellDef> Supplier Id </th>
          <td mat-cell *matCellDef="let element"> {{element.supplierID}} </td>
        </ng-container>

        <ng-container matColumnDef="supplierName">
          <th mat-header-cell *matHeaderCellDef> Supplier Name </th>
          <td mat-cell *matCellDef="let element"> {{element.supplierName}} </td>
        </ng-container>

        <ng-container matColumnDef="contactNumber">
          <th mat-header-cell *matHeaderCellDef> Contact number </th>
          <td mat-cell *matCellDef="let element"> {{element.contactNumber}} </td>
        </ng-container>

        <ng-container matColumnDef="supplierEmailAddress">
          <th mat-header-cell *matHeaderCellDef> Emial address </th>
          <td mat-cell *matCellDef="let element"> {{element.supplierEmailAddress}} </td>
        </ng-container>

        <ng-container matColumnDef="address">
          <th mat-header-cell *matHeaderCellDef> Address </th>
          <td mat-cell *matCellDef="let element"> {{element.address}} </td>
        </ng-container>

        

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
      <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of users"></mat-paginator>


    </div>
  </div>

  <div class="report-footer">
    <p>Generated on {{ getDate() }}</p>
  </div>
</div>

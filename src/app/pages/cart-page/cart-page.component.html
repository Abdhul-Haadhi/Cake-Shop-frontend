
<div class="container">
    <button (click)="backToOrderPage()" mat-raised-button color="warn">
          Back to orders
        </button>
    <mat-card class="cart-card" appearance="outlined">
            <div class="table-section"> 
                <mat-toolbar color="primary">
                    <span>Product cart</span>
                    <span class="example-spacer"></span>
                </mat-toolbar>
                <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
                    <ng-container matColumnDef="item">
                        <th mat-header-cell *matHeaderCellDef> Item </th>
                        <td mat-cell *matCellDef="let element"> {{product.name}} </td>
                    </ng-container>

                    <ng-container matColumnDef="size">
                        <th mat-header-cell *matHeaderCellDef> Size </th>
                        <td mat-cell *matCellDef="let element"> {{element.size}} </td>
                    </ng-container>

                    <ng-container matColumnDef="quantity">
                        <th mat-header-cell *matHeaderCellDef> Quantity </th>
                        <td mat-cell *matCellDef="let element"> {{element.quantity}} </td>
                    </ng-container>

                    <ng-container matColumnDef="itemPrice">
                        <th mat-header-cell *matHeaderCellDef> Item price </th>
                        <td mat-cell *matCellDef="let element"> {{product.price}} </td>
                    </ng-container>

                    <ng-container matColumnDef="totalPrice">
                        <th mat-header-cell *matHeaderCellDef> Total price </th>
                        <td mat-cell *matCellDef="let element"> {{element.totalPrice}} </td>
                    </ng-container>

                    <ng-container matColumnDef="actions">
                        <th mat-header-cell *matHeaderCellDef> Actions </th>
                        <td mat-cell *matCellDef="let element">
                        <button mat-icon-button color="warn" (click)="deleteData(element)" matTooltip="delete">
                            <mat-icon>delete</mat-icon>
                        </button>
                        </td>
                    </ng-container>
                    
                    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                </table>
                <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of users"></mat-paginator>
            </div>
    </mat-card>
</div>

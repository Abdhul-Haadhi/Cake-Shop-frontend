
<div class="container">
    <button (click)="backToOrderPage()" mat-raised-button color="warn">
          Back to orders
    </button>
    <button mat-raised-button color="warn ms-2" (click)="closePage()">Close</button>
    <mat-card class="cart-card" appearance="outlined">
            <div class="table-section"> 
                <mat-toolbar color="primary">
                    <span>Product cart</span>
                    <span class="example-spacer"></span>
                </mat-toolbar>
                <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
                    <ng-container matColumnDef="select">
                        <th mat-header-cell *matHeaderCellDef>
                            <mat-checkbox (change)="$event ? toggleAllRows() : null" [checked]="selection.hasValue() && isAllSelected()" [indeterminate]="selection.hasValue() && !isAllSelected()">

                            </mat-checkbox>
                        </th>
                        <td mat-cell *matCellDef="let row">
                            <mat-checkbox (click)="$event.stopPropagation()" (change)="$event ? selection.toggle(row) : null" [checked]="selection.isSelected(row)">
                                
                            </mat-checkbox>
                        </td>
                    </ng-container>

                    <ng-container matColumnDef="image">
                        <!-- <th mat-header-cell *matHeaderCellDef> Image </th>
                        <td mat-cell *matCellDef="let element"> <img [src]="product.image" [alt]="element.name" class="product-image"/> </td> -->
                        <th mat-header-cell *matHeaderCellDef> Image </th>
                        <td mat-cell *matCellDef="let element"> <img [src]="'data:' + element.imageType + ';base64,' + element.image" 
                            [alt]="element.product" width="100" height="100" class="product-image"/> </td>
                    </ng-container>

                    <ng-container matColumnDef="item">
                        <th mat-header-cell *matHeaderCellDef> Product name </th>
                        <td mat-cell *matCellDef="let element"> {{element.item}} </td>
                    </ng-container>

                    <ng-container matColumnDef="size">
                        <th mat-header-cell *matHeaderCellDef> Selected Size </th>
                        <td mat-cell *matCellDef="let element"> {{element.size+"g"}} </td>
                    </ng-container>

                    <ng-container matColumnDef="quantity">
                        <th mat-header-cell *matHeaderCellDef> Quantity </th>
                        <td mat-cell *matCellDef="let element"> {{element.quantity}} </td>
                    </ng-container>

                    <ng-container matColumnDef="itemPrice">
                        <th mat-header-cell *matHeaderCellDef> Item price </th>
                        <td mat-cell *matCellDef="let element"> {{"Rs."+element.price}} </td>
                    </ng-container>

                    <ng-container matColumnDef="totalPrice">
                        <th mat-header-cell *matHeaderCellDef> Total price </th>
                        <td mat-cell *matCellDef="let element"> {{"Rs."+element.totalPrice}} </td>
                    </ng-container>

                    <ng-container matColumnDef="actions">
                        <th mat-header-cell *matHeaderCellDef> Actions </th>
                        <td mat-cell *matCellDef="let element">
                        <button mat-icon-button color="warn" (click)="deleteData(element)" matTooltip="delete">
                            <mat-icon>delete</mat-icon>
                        </button>
                        </td>
                    </ng-container>
                    
                    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

                </table>
                
                <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of users"></mat-paginator>

                <div class="checkout-container">
                    <button mat-raised-button color="warn" class="checkout_button" (click)="checkOutBtn()">Checkout</button>
                </div>
                

            </div>
    </mat-card>
</div>
